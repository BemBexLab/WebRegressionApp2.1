# Supabase local JWT defaults (well-known Supabase CLI demo keys — rotate for production)
x-supabase-keys: &supabase-keys
  ANON_KEY: ${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0}
  SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU}
  PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}

services:
  # ── PostgreSQL (Supabase roles pre-created via init script) ─────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: webregression
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Supabase Storage (file backend — no S3, no imgproxy) ────────────────────
  supabase-storage:
    image: supabase/storage-api:v1.11.13
    restart: unless-stopped
    environment:
      <<: *supabase-keys
      POSTGREST_URL: ""
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/webregression?options=-c%20search_path%3Dstorage%2Cpublic
      FILE_SIZE_LIMIT: "52428800"
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: local
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - supabase_storage:/var/lib/storage
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── API ──────────────────────────────────────────────────────────────────────
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/webregression
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      PORT: 4000
      MAX_PAGES_PER_SITE: ${MAX_PAGES_PER_SITE:-80}
      DIFF_THRESHOLD: ${DIFF_THRESHOLD:-0.01}
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Worker ───────────────────────────────────────────────────────────────────
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      supabase-storage:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/webregression
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SCAN_CONCURRENCY: ${SCAN_CONCURRENCY:-2}
      BASELINE_CONCURRENCY: ${BASELINE_CONCURRENCY:-1}
      BULLMQ_LOCK_DURATION_MS: ${BULLMQ_LOCK_DURATION_MS:-300000}
      BULLMQ_STALLED_INTERVAL_MS: ${BULLMQ_STALLED_INTERVAL_MS:-60000}
      SCREENSHOT_FULL_PAGE: ${SCREENSHOT_FULL_PAGE:-true}
      SCREENSHOT_MAX_SCROLL_STEPS: ${SCREENSHOT_MAX_SCROLL_STEPS:-12}
      # Points directly at the storage-api container (StorageClient uses this as base URL)
      SUPABASE_STORAGE_URL: http://supabase-storage:5000
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-screenshots}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      FROM_EMAIL: ${FROM_EMAIL:-noreply@webregression.local}
      NOTIFICATION_EMAIL: ${NOTIFICATION_EMAIL:-}
      AUTO_SCAN_INTERVAL_MINUTES: ${AUTO_SCAN_INTERVAL_MINUTES:-20}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    shm_size: "1gb"
    deploy:
      resources:
        limits:
          memory: 4G

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
        API_URL: http://api:4000
        STORAGE_URL: http://supabase-storage:5000
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:4000
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      STORAGE_URL: http://supabase-storage:5000
    ports:
      - "3001:3000"

  # ── Nginx ────────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_certs:/etc/nginx/certs

volumes:
  postgres_data:
  redis_data:
  supabase_storage:
  nginx_certs:
